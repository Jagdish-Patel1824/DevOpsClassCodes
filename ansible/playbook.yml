---
- name: ContactBook's Full DevOps Setup (K3s + Helm + Monitoring + App)
  hosts: k8s-master
  become: yes

  environment:
    KUBECONFIG: /etc/rancher/k3s/k3s.yaml

  tasks:
   
    - name: Copy K8s files to server
      copy:
        src: /Users/jagdish/Documents/DevOpsClassCodes/k8s/
        dest: /home/ubuntu/k8s/

    - name: Copy Monitoring files
      copy:
        src: /Users/jagdish/Documents/DevOpsClassCodes/monitoring/
        dest: /home/ubuntu/monitoring/

    # 🟩 Step 0: Install K3s (only if not installed)
    - name: Install K3s
      shell: curl -sfL https://get.k3s.io | sh -
      args:
        creates: /usr/local/bin/k3s

    # 🟩 Step 0.1: Wait for Kubernetes to be ready
    - name: Wait for node to be ready
      shell: kubectl get nodes
      register: result
      retries: 10
      delay: 10
      until: result.rc == 0

    # 🟦 Step 1: Install Helm (only if not installed)
    - name: Install Helm
      shell: curl https://raw.githubusercontent.com/helm/helm/main/scripts/get-helm-3 | bash
      args:
        creates: /usr/local/bin/helm

    # 🟦 Step 2: Add Prometheus repo
    - name: Add Prometheus Helm repo
      shell: |
        helm repo add prometheus-community https://prometheus-community.github.io/helm-charts
        helm repo update

    # 🟥 Step 3: Install / Upgrade Prometheus + Grafana
    - name: Install Prometheus Stack
      shell: |
        helm upgrade --install monitoring prometheus-community/kube-prometheus-stack \
        --namespace monitoring --create-namespace

    # 🟨 Step 4: Deploy your app
    - name: Apply Deployment
      command: kubectl apply -f /home/ubuntu/k8s/deployment.yml

    - name: Apply Service
      command: kubectl apply -f /home/ubuntu/k8s/service.yml

    # 🟪 Step 5: Connect Prometheus to app
    - name: Apply ServiceMonitor
      command: kubectl apply -f /home/ubuntu/monitoring/serviceMonitor.yml

    # 🟫 Step 6: Load Grafana dashboard
    - name: Apply Dashboard ConfigMap
      command: kubectl apply -f /home/ubuntu/monitoring/dashboard.json

    

       