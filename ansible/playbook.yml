- name: Deploy WAR on Tomcat
  hosts: all
  become: yes

  vars:
    tomcat_path: /opt/tomcat

  tasks:

    - name: Install Java
      apt:
        name: openjdk-17-jdk
        state: present
        update_cache: yes

    - name: Install Tomcat
      apt:
        name: tomcat9
        state: present

    - name: Start Tomcat service
      service:
        name: tomcat9
        state: started
        enabled: yes

    - name: Copy WAR file
      copy:
        src: ../target/addressbook.war
        dest: /var/lib/tomcat9/webapps/addressbook.war

    - name: Restart Tomcat
      service:
        name: tomcat9
        state: restarted
